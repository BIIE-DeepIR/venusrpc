[project]
name = "venusrpc"
version = "0.1.0"
description = "Fast HTTP-based bridge from Python to the Hamilton Venus HSL runtime."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
authors = [{ name = "Valerijs Korotkovs" }]
keywords = ["hamilton", "venus", "hsl", "liquid handling", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pandas>=2.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyodbc>=5.3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
venusrpc = "venusrpc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venusrpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
